name: Job Scraper Automation

permissions:
  contents: write

concurrency:
  group: job-scraper-main
  cancel-in-progress: false

on:
  workflow_dispatch:

  schedule:
    - cron: "0 */12 * * *"

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Diagnose Chrome Runtime
        run: |
          echo "===== Operating System ====="
          uname -a

          echo ""
          echo "===== Google Chrome ====="
          google-chrome --version || true
          which google-chrome || true

          echo ""
          echo "===== ChromeDriver ====="
          chromedriver --version || true
          which chromedriver || true

          echo ""
          echo "===== Memory ====="
          free -h || true

          echo ""
          echo "===== Shared Memory ====="
          df -h /dev/shm || true

          echo ""
          echo "===== Disk ====="
          df -h || true

          echo ""
          echo "===== Chrome Processes ====="
          ps aux | grep -i chrome || true

      - name: Run Job Scraper
        run: |
          python main.py

      - name: Show Repository Status
        run: |
          echo "===== Git Status ====="
          git status

          echo ""
          echo "===== Data Folder ====="
          ls -lah data || true

          echo ""
          echo "===== Database ====="
          ls -lah database || true

      - name: Commit Updated Data
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

          # Stage every change in the repository
          git add -A

          echo ""
          echo "===== Git Status After Add ====="
          git status

          # Exit successfully if nothing changed
          if git diff --cached --quiet; then
            echo "No changes detected."
            exit 0
          fi

          git commit -m "Automatic job data update"

      - name: Push Changes
        run: |
          echo "===== Synchronizing With Remote Main ====="

          git fetch origin main
          git rebase origin/main

          echo ""
          echo "===== Pushing Automated Data Update ====="

          git push origin HEAD:main